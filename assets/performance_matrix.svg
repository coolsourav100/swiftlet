<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #1E1E1E; }
            .card-bg { fill: #2A2A2A; rx: 8; }
            .text-main { fill: #E0E0E0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
            .text-title { font-size: 24px; font-weight: bold; fill: #FFFFFF; }
            .text-subtitle { font-size: 14px; fill: #888888; }
            .card-title { font-size: 18px; font-weight: bold; fill: #FFFFFF; }
            .card-label { font-size: 13px; fill: #AAAAAA; }
            .card-value { font-size: 15px; font-weight: bold; fill: #E0E0E0; }
            .split-cpu { fill: #4CAF50; font-weight: bold; }
            .split-gpu { fill: #007ACC; font-weight: bold; }
        </style>
    </defs>
    
    <rect width="100%" height="100%" class="bg" rx="12"/>
    
    <text x="40" y="50" class="text-main text-title">Phase-Aware Performance Matrix</text>
    <text x="40" y="75" class="text-main text-subtitle">Measured on Apple M5 (16GB) | Prefill (TTFT) vs Decode (TPOT)</text>

    <!-- Card 1: Short Chat -->
    <rect x="40" y="110" width="220" height="240" class="card-bg"/>
    <text x="150" y="145" class="text-main card-title" text-anchor="middle">Short Chat</text>
    <text x="150" y="165" class="text-main card-label" text-anchor="middle">TPOT / Decode Bound</text>
    
    <rect x="60" y="185" width="180" height="1" fill="#444"/>
    <text x="60" y="210" class="text-main card-label">Tokens:</text>
    <text x="240" y="210" class="text-main card-value" text-anchor="end">50 In / 200 Out</text>
    
    <text x="60" y="235" class="text-main card-label">Speed:</text>
    <text x="240" y="235" class="text-main card-value" text-anchor="end">24.8 tok/s</text>
    
    <rect x="60" y="255" width="180" height="1" fill="#444"/>
    <text x="150" y="280" class="text-main card-label" text-anchor="middle">Optimal Hardware Split</text>
    <text x="150" y="305" class="text-main card-value" text-anchor="middle">
        <tspan class="split-cpu">8 CPU</tspan> / <tspan class="split-gpu">91 GPU</tspan>
    </text>
    <text x="150" y="330" class="text-main card-value" text-anchor="middle" fill="#FFBD2E">Maximizes Gen Speed</text>

    <!-- Card 2: Code Gen -->
    <rect x="290" y="110" width="220" height="240" class="card-bg"/>
    <text x="400" y="145" class="text-main card-title" text-anchor="middle">Code Gen</text>
    <text x="400" y="165" class="text-main card-label" text-anchor="middle">Balanced Load</text>
    
    <rect x="310" y="185" width="180" height="1" fill="#444"/>
    <text x="310" y="210" class="text-main card-label">Tokens:</text>
    <text x="490" y="210" class="text-main card-value" text-anchor="end">1K In / 500 Out</text>
    
    <text x="310" y="235" class="text-main card-label">Speed:</text>
    <text x="490" y="235" class="text-main card-value" text-anchor="end">22.1 tok/s</text>
    
    <rect x="310" y="255" width="180" height="1" fill="#444"/>
    <text x="400" y="280" class="text-main card-label" text-anchor="middle">Optimal Hardware Split</text>
    <text x="400" y="305" class="text-main card-value" text-anchor="middle">
        <tspan class="split-cpu">4 CPU</tspan> / <tspan class="split-gpu">99 GPU</tspan>
    </text>
    <text x="400" y="330" class="text-main card-value" text-anchor="middle" fill="#FFBD2E">Balances Prefill &amp; Gen</text>

    <!-- Card 3: Doc Q&A -->
    <rect x="540" y="110" width="220" height="240" class="card-bg"/>
    <text x="650" y="145" class="text-main card-title" text-anchor="middle">10K Doc Q&amp;A</text>
    <text x="650" y="165" class="text-main card-label" text-anchor="middle">TTFT / Prefill Bound</text>
    
    <rect x="560" y="185" width="180" height="1" fill="#444"/>
    <text x="560" y="210" class="text-main card-label">Tokens:</text>
    <text x="740" y="210" class="text-main card-value" text-anchor="end">10K In / 100 Out</text>
    
    <text x="560" y="235" class="text-main card-label">Prefill:</text>
    <text x="740" y="235" class="text-main card-value" text-anchor="end">231 tok/s</text>
    
    <rect x="560" y="255" width="180" height="1" fill="#444"/>
    <text x="650" y="280" class="text-main card-label" text-anchor="middle">Optimal Hardware Split</text>
    <text x="650" y="305" class="text-main card-value" text-anchor="middle">
        <tspan class="split-cpu">0 CPU</tspan> / <tspan class="split-gpu">99 GPU</tspan>
    </text>
    <text x="650" y="330" class="text-main card-value" text-anchor="middle" fill="#FFBD2E">Minimizes TTFT</text>
</svg>